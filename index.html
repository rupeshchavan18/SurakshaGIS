<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/shield-alert.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SurakshaGIS | Disaster Risk & Relocation Planning Platform (SIH26191)</title>
    <meta name="description" content="Intelligent GIS Decision Support System for Multi-Hazard Red Zone Mapping, Carrying Capacity Assessment, and Relocation Prioritization." />
    <!-- Initialize Theme before paint to prevent flashing -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('suraksha_theme');
          if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-gis-darkest text-slate-100 font-sans antialiased min-h-screen overflow-hidden selection:bg-gis-accent selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
